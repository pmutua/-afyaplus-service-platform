# deployment.yaml - read-only, per the capstone brief's own fallback
# ("No Kubernetes cluster: nobody has one this week; the read-only
# deployment.yaml plus a written scaling scenario satisfies Tuesday's
# requirement. Do not invent a live cluster"). Nothing in this repo applies
# or runs this manifest.
#
# livenessProbe points at GET /health -- the one route app/main.py leaves
# unprotected specifically so an orchestrator never needs credentials to
# ask "are you alive?".
apiVersion: apps/v1
kind: Deployment
metadata:
  name: afyaplus-platform
  namespace: afyaplus
  labels:
    app.kubernetes.io/name: afyaplus-platform
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 3
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: afyaplus-platform
  template:
    metadata:
      labels:
        app: afyaplus-platform
        app.kubernetes.io/name: afyaplus-platform
        app.kubernetes.io/version: "1.0.0"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: afyaplus-platform
          image: afyaplus-platform:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - secretRef:
                name: afyaplus-platform-secrets # JWT_SECRET, OPENAI_API_KEY -- never in the image
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
